  /api/groups/preview:
    post:
      summary: Exact equal-split amounts for a bill
      description: |
        Returns the per-friend and organizer amounts that POST /api/groups will stage in `equal` mode for the same
        organizer, total and friend count. Both use one function, so a preview always equals the staged shares. Remainder
        minor units are rotated by a deterministic offset seeded from (organizer, total, friend count); friends keep their
        submitted order and the organizer is the last participant.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalMinor, friendCount]
              properties:
                totalMinor:
                  type: integer
                  minimum: 1
                  maximum: 1000000000
                friendCount:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: Shares in minor units. `friendShares[i]` is for the i-th friend; sum(friendShares) + organizerShareMinor = totalMinor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMinor:
                    type: integer
                  currency:
                    type: string
                  friendShares:
                    type: array
                    items:
                      type: integer
                  organizerShareMinor:
                    type: integer
        '400':
          description: VALIDATION_FAILED

  /api/groups:
    get:
      summary: List the organizer's group outings
      description: Each outing with its friend payments (including the public checkout token) and a paid count. Only groups organized by the caller are returned.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Groups
    post:
      summary: Stage Group Split Outing
      security:
        - BearerAuth: []
      description: Splits cost equally (remainder minor units rotated deterministically; see POST /api/groups/preview) or by custom shares. Stages pending approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueName, totalMinor, friends]
              properties:
                venueName:
                  type: string
                totalMinor:
                  type: integer
                currency:
                  type: string
                friends:
                  type: array
                  items:
                    type: object
                    required: [name, contact, shareMinor]
                    properties:
                      name:
                        type: string
                      contact:
                        type: string
                      shareMinor:
                        type: integer
      responses:
        '200':
          description: Group staged with pending approval

  /api/groups/{id}/settlement:
    get:
      summary: Money ledger for one outing
      description: |
        Every PayPal capture and refund recorded for the outing (append-only), plus what is currently held.
        Friends' payments are collected into Pocketful's own PayPal merchant account (`heldBy: platform`). There is no
        payout to the organizer or the venue; this is a record of money moved, not a transfer. Only the organizer can read it.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ledger entries and totals in minor units
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                  currency:
                    type: string
                  collectedMinor:
                    type: integer
                  refundedMinor:
                    type: integer
                  heldMinor:
                    type: integer
                    description: collectedMinor - refundedMinor
                  captures:
                    type: integer
                  refunds:
                    type: integer
                  heldBy:
                    type: string
                    enum: [platform]
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        paymentId:
                          type: string
                        kind:
                          type: string
                          enum: [capture, refund]
                        amountMinor:
                          type: integer
                        currency:
                          type: string
                        actor:
                          type: string
                          enum: [friend_capture, webhook, organizer, system]
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Group not found or not yours

