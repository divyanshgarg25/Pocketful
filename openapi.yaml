openapi: 3.1.0
info:
  title: Pocketful Autonomous Lifestyle Financial Agent API
  version: 1.0.0
  description: >-
    The production REST API for Pocketful: an autonomous weekend financial lifestyle agent
    that audits ghost subscriptions, calculates deterministic guilt-free fun money, recommends
    closed-world weekend blueprints via Thompson Sampling, handles multi-friend PayPal splits
    with penny-perfect arithmetic, and enforces deterministic Guardian security policies.
servers:
  - url: http://localhost:3001
    description: Local Development / Demo Server
  - url: https://pocketful-api.onrender.com
    description: Render Cloud Production Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer JWT token for authenticated user sessions
    IdempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
      description: Unique 16-128 character idempotency key required for financial mutations

  schemas:
    StepUpProof:
      description: Proof from one real factor, bound to the challenge the server issued. Exactly one `method` per request.
      oneOf:
        - type: object
          required: [method, assertion]
          properties:
            method:
              type: string
              enum: [passkey]
            assertion:
              type: object
              description: AuthenticationResponseJSON from navigator.credentials.get() (user verification required)
        - type: object
          required: [method, code]
          properties:
            method:
              type: string
              enum: [totp]
            code:
              type: string
              pattern: '^[0-9]{6}$'
        - type: object
          required: [method, pin]
          properties:
            method:
              type: string
              enum: [pin]
            pin:
              type: string
        - type: object
          required: [method, testProof]
          description: Software test authenticator. Only accepted when STEP_UP_TEST_MODE=true outside production; the API refuses to boot with it in production.
          properties:
            method:
              type: string
              enum: [test]
            testProof:
              type: string
              pattern: '^[0-9a-f]{64}$'

    StepUpMethod:
      type: string
      enum: [passkey, totp, pin, test]

    StepUpStatus:
      type: object
      properties:
        enrolled:
          type: boolean
        methods:
          type: array
          items:
            $ref: '#/components/schemas/StepUpMethod'
        passkeys:
          type: integer
        totp:
          type: boolean
        pin:
          type: boolean
        lockedUntil:
          type: [string, 'null']
          format: date-time
        cooldownRemainingSeconds:
          type: integer
          minimum: 0
          description: Seconds until a newly enrolled/replaced/reset factor may approve money actions (0 = none running).

    StepUpChallenge:
      type: object
      properties:
        challengeNonce:
          type: string
        expiresAt:
          type: string
          format: date-time
        methods:
          type: array
          items:
            $ref: '#/components/schemas/StepUpMethod'
        passkeyOptions:
          type: object
          description: PublicKeyCredentialRequestOptionsJSON (present when the user has a passkey)
        testChallenge:
          type: string
          description: Present only in test mode; the value the software test authenticator signs.

    ApiResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
        requestId:
          type: string
          example: req_1730761200000_abc12
        data:
          type: object
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - GUARDIAN_BLOCKED
            - APPROVAL_REQUIRED
            - APPROVAL_EXPIRED
            - IDEMPOTENT_REPLAY
            - CONCURRENT_ACTION
            - ALREADY_REFUNDED
            - OUTING_CANCELLED
            - OUTING_EXPIRED
            - UPSTREAM_PAYPAL
            - UPSTREAM_LLM
            - RATE_LIMITED
            - ACCOUNT_ERASED
            - STEP_UP_NOT_ENROLLED
            - STEP_UP_REQUIRED
            - STEP_UP_CHALLENGE_REQUIRED
            - STEP_UP_CHALLENGE_EXPIRED
            - STEP_UP_CHALLENGE_INVALID
            - STEP_UP_LOCKED
            - STEP_UP_FAILED
            - STEP_UP_COOLDOWN
            - FRESH_SESSION_REQUIRED
            - REGION_REQUIRED
            - ALREADY_EXECUTED
            - RETRY_LIMIT
            - EXECUTION_FAILED
            - INTERNAL_ERROR
          example: VALIDATION_FAILED
        message:
          type: string
          example: Input validation failed
        details:
          type: object
        requestId:
          type: string
          example: req_1730761200000_abc12

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        home_address:
          type: string
        home_lat:
          type: number
        home_lng:
          type: number
        guilt_free_cap_minor:
          type: integer
        per_action_cap_minor:
          type: integer
        weekly_cap_minor:
          type: integer
        currency:
          type: string
          example: USD
        max_distance_km:
          type: number
        opt_in_mood:
          type: boolean
        opt_in_tracking:
          type: boolean
        exploration_level:
          type: string
          enum: [off, low, normal]

    WalletStatement:
      type: object
      properties:
        totalBalanceMinor:
          type: integer
          example: 284000
        totalBalanceFormatted:
          type: string
          example: "$2,840.00"
        funMoneyMinor:
          type: integer
          example: 14000
        funMoneyFormatted:
          type: string
          example: "$140.00"
        guiltFreeCapMinor:
          type: integer
          example: 25000
        pockets:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [weekly, holiday, getaway]
              balanceMinor:
                type: integer
              balanceFormatted:
                type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_name:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        billing_cycle:
          type: string
          enum: [monthly, annual, weekly]
        status:
          type: string
          enum: [active, pending_cancellation, cancelled]
        is_ghost:
          type: boolean
        days_unused:
          type: integer

    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        action_type:
          type: string
          enum:
            - cancel_subscription
            - send_requests
            - refund_group
            - vault_move
            - pocket_move
            - reset_learning
            - delete_data
            - change_caps
        preview:
          type: string
        amount_minor:
          type: integer
        money_out_minor:
          type: integer
        status:
          type: string
          enum: [pending, approved, executing, executed, failed, denied, expired, cancelled]
        idempotency_key:
          type: string
        challenge_nonce:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time

paths:
  /healthz:
    get:
      summary: Liveness Probe
      description: Returns service liveness status and environment.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /readyz:
    get:
      summary: Readiness Probe
      description: Verifies database and external dependency connectivity. Returns 503 if not ready.
      responses:
        '200':
          description: Service is ready for traffic
        '503':
          description: Service dependency unavailable

  /api/auth/dev-token:
    post:
      summary: Development Token Generation
      description: Generates a signed development JWT. Strictly disabled in production.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                email:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Signed token generated
        '403':
          description: Forbidden in production

  /api/auth/signup:
    post:
      summary: New User Registration
      description: Signs up a new user account with secure defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
      responses:
        '200':
          description: Registration successful
        '400':
          description: Validation error

  /webhooks/paypal:
    post:
      summary: PayPal Webhook Ingestion
      description: Verifies webhook signature, deduplicates idempotently via webhook_events, and reconciles split captures.
      parameters:
        - in: header
          name: paypal-transmission-id
          required: true
          schema:
            type: string
        - in: header
          name: paypal-transmission-sig
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed or deduplicated
        '401':
          description: Invalid PayPal signature

  /api/places/geocode:
    get:
      summary: Geocode Address Query
      description: Geocodes address via OpenStreetMap Nominatim with 1 req/sec rate limiting.
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Geocode coordinates returned

  /api/places/reverse-geocode:
    get:
      summary: Reverse Geocode Lat/Lng Coordinates
      description: Resolves lat/lng coordinates to neighborhood/city name via Nominatim with rate limiting.
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
        - in: query
          name: lng
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Reverse geocode result returned

  /pay/{token}:
    get:
      summary: Friend Checkout Statement Page
      description: Unauthenticated public page allowing a friend to review their split payment details.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Friend payment details returned
        '404':
          description: Payment token not found or cancelled

  /pay/{token}/capture:
    post:
      summary: Friend Checkout Payment Capture
      description: Captures friend split share via PayPal Sandbox REST API. Fails closed on draft groups.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Share marked as paid and recorded
        '409':
          description: Outing already finalized or cancelled

  /api/onboarding:
    post:
      summary: User Onboarding Vibe Check
      description: |
        Saves the user's own baseline: where they are, how far they will go, their guilt-free weekly amount and
        preferences. Nothing is invented for the account: the name is the one supplied at sign-up (or `name` here),
        and the weekly pocket is created at zero if absent. `timezone` matters because the weekly cap resets at
        Monday 00:00 in that IANA zone; if omitted the existing zone is kept.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Display name (trimmed). Defaults to the existing profile name.
                timezone:
                  type: string
                  maxLength: 64
                  example: Asia/Kolkata
                  description: IANA time zone. 400 VALIDATION_FAILED if unknown.
                address:
                  type: string
                  minLength: 1
                  description: Free text, or a "lat, lng" pair. Geocoded server-side.
                reachKm:
                  type: number
                  minimum: 1
                  maximum: 50
                  default: 5
                guiltFreeCapMinor:
                  type: integer
                  minimum: 0
                  default: 15000
                interests:
                  type: array
                  items:
                    type: string
                socialPref:
                  type: string
                  enum: [solo, social, mixed]
                  default: mixed
                vibePref:
                  type: string
                  enum: [quiet, lively, mixed]
                  default: quiet
                optInMood:
                  type: boolean
                  default: true
                optInTracking:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Profile, preferences and geocode result
        '400':
          description: VALIDATION_FAILED (bad timezone, empty name or address, out-of-range reach)

  /api/me:
    get:
      summary: Current User Profile & Preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details returned

  /api/me/settings:
    patch:
      summary: Update User Settings
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxDistanceKm:
                  type: number
                guiltFreeCapMinor:
                  type: integer
                currency:
                  type: string
                optInMood:
                  type: boolean
                optInTracking:
                  type: boolean
      responses:
        '200':
          description: Settings updated

  /api/me/export:
    get:
      summary: GDPR Full Data Export
      security:
        - BearerAuth: []
      description: Exports full user ledger, preferences, transactions, plans, and audit logs as a downloadable JSON file.
      responses:
        '200':
          description: Full data bundle exported

  /api/me/data:
    delete:
      summary: GDPR Right-to-be-Forgotten Data Erasure
      security:
        - BearerAuth: []
      description: Permanently erases all user profile, ledger, transaction, and learning records.
      responses:
        '200':
          description: User data permanently erased
        '401':
          description: Unauthorized or ACCOUNT_ERASED (once erased, subsequent calls with old tokens fail with code ACCOUNT_ERASED)

  /api/wallet:
    get:
      summary: Wallet Overview & Available Fun Money
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balances and fun money returned

  /api/wallet/statement:
    get:
      summary: Itemized Financial Statement
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Itemized financial statement returned

  /api/wallet/pockets:
    get:
      summary: Vault Pockets Status
      security:
        - BearerAuth: []
      description: Returns Weekly Leisure, Holiday, and Getaway pocket balances.
      responses:
        '200':
          description: Pockets array returned

  /api/subscriptions:
    get:
      summary: Active & Cancelled Subscriptions List
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of subscriptions returned

  /api/subscriptions/audit:
    get:
      summary: Ghost Subscription Auditor Scan
      security:
        - BearerAuth: []
      description: Scans recurring transactions for dormant or low-usage subscriptions using rational weeks-per-month arithmetic.
      responses:
        '200':
          description: Ghost subscriptions with explanations

  /api/subscriptions/cancel/preview:
    post:
      summary: Stage Subscription Cancellation Approval
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionIds]
              properties:
                subscriptionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Staged pending approval with yearly savings preview

  /api/subscriptions/{id}/snooze:
    post:
      summary: Snooze Ghost Subscription Notice
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  default: 30
      responses:
        '200':
          description: Subscription notice snoozed

  /api/approvals:
    get:
      summary: List Staged & Past Approvals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of approvals returned

  /api/auth/step-up:
    get:
      summary: Step-up factor status
      description: Which verification methods the user has set up (passkeys, authenticator app, PIN) and whether PIN/TOTP are currently locked. Never returns secrets, hashes or keys.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Enrollment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpStatus'

  /api/auth/step-up/challenge:
    post:
      summary: Challenge for changing your own verification methods
      description: Single-use, 5-minute challenge that a passkey proof must sign before you can add or change a factor once any factor exists. PIN/TOTP proofs do not need it.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Challenge issued. `passkeyOptions` is present when the user has a passkey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpChallenge'

  /api/auth/step-up/pin:
    put:
      summary: Enroll or change the step-up PIN
      description: The first factor a user ever sets needs only the session (trust-on-first-use; enrol during onboarding). Once any factor exists, `proof` from an existing factor is required (`currentPin` is a shorthand for a PIN proof). PIN is scrypt-hashed; PIN and TOTP share one counter, 5 wrong attempts lock both for 15 minutes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: '^[0-9]{6,12}$'
                currentPin:
                  type: string
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Enrolled
        '400':
          description: Invalid or too-easy PIN
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED or STEP_UP_CHALLENGE_EXPIRED when changing an existing setup; FRESH_SESSION_REQUIRED when enrolling the first factor with a session token older than 5 minutes
    delete:
      summary: Remove the step-up PIN
      description: Needs `proof` from an existing factor (a PIN proof may be the PIN being removed). Removing the last factor restarts the enrollment cooldown for the next enrollment. Writes an audit row and a user-visible notification.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Removed
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED or STEP_UP_CHALLENGE_EXPIRED
        '404':
          description: No PIN is set

  /api/auth/step-up/totp:
    delete:
      summary: Remove the authenticator app
      description: Same rules as removing the PIN.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Removed
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED or STEP_UP_CHALLENGE_EXPIRED
        '404':
          description: No authenticator app is set

  /api/auth/step-up/totp/enroll:
    post:
      summary: Start authenticator-app (TOTP) enrollment
      description: Returns the shared secret and otpauth URI exactly once (Cache-Control no-store). The secret is stored AES-256-GCM sealed in a pending slot and only becomes active after /totp/confirm, so an abandoned enrollment never disturbs a working authenticator. Authorised like the PIN endpoint.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPin:
                  type: string
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Secret for the QR code (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Base32 secret
                  otpauthUri:
                    type: string
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED

  /api/auth/step-up/totp/confirm:
    post:
      summary: Confirm authenticator-app enrollment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Authenticator activated
        '400':
          description: Enrollment not started or malformed code
        '403':
          description: STEP_UP_FAILED or STEP_UP_LOCKED

  /api/auth/passkeys:
    get:
      summary: List registered passkeys
      description: Metadata only (label, device type, timestamps). Public keys and credential ids are never returned.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Passkeys

  /api/auth/passkeys/{id}:
    delete:
      summary: Remove one of your passkeys
      description: Needs `proof` from an existing factor. Only the caller's own passkeys can be removed. Removing the last factor restarts the enrollment cooldown for the next enrollment.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Removed
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED or STEP_UP_CHALLENGE_EXPIRED
        '404':
          description: Passkey not found

  /api/auth/security-notifications:
    get:
      summary: Notifications about changes to your verification methods
      description: Newest first, at most 20. One entry whenever a PIN, authenticator app or passkey is enrolled, replaced or removed. Never contains secrets, PINs or codes.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications (`kind` is factor_enrolled, factor_replaced or factor_removed; `factor` is pin, totp or passkey)

  /api/auth/passkeys/register/options:
    post:
      summary: Begin passkey registration (WebAuthn creation options)
      description: Authorised like the PIN endpoint. Stores a single-use 5-minute registration challenge. User verification is required and attestation is not requested.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPin:
                  type: string
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: PublicKeyCredentialCreationOptionsJSON under `options`
        '403':
          description: STEP_UP_REQUIRED, STEP_UP_FAILED, STEP_UP_LOCKED, STEP_UP_CHALLENGE_EXPIRED
        '409':
          description: Passkey limit reached

  /api/auth/passkeys/register/verify:
    post:
      summary: Finish passkey registration
      description: Verifies the attestation against the stored challenge, the configured RP ID and allowed origins, with user verification required. Stores the public key, counter and transports.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation:
                  type: object
                  description: RegistrationResponseJSON from navigator.credentials.create()
                label:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: Registered
        '400':
          description: Challenge missing/expired or attestation invalid
        '409':
          description: Credential already registered

  /api/approvals/{id}:
    get:
      summary: Get Approval By ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approval record returned

  /api/approvals/{id}/challenge:
    post:
      summary: Request a single-use step-up challenge for this approval
      description: |
        Returns a single-use 5-minute nonce. The server stores, with the nonce, a fingerprint
        sha256(approvalId | userId | action_type | amount_minor | money_out_minor | canonical(payload) | expires_at).
        A passkey signs a challenge derived from nonce + fingerprint, so a signature made for one approval is worthless for
        any other. `passkeyOptions` (WebAuthn request options) is present when the user has a passkey. Nothing returned
        here lets a client derive a proof without a real factor.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpChallenge'
        '403':
          description: STEP_UP_NOT_ENROLLED - set up a passkey, authenticator app, or PIN first

  /api/approvals/{id}/decide:
    post:
      summary: Execute or Deny Approval via Guardian State Machine
      security:
        - BearerAuth: []
        - IdempotencyKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, deny]
                challengeNonce:
                  type: string
                  description: Single-use nonce from POST /api/approvals/{id}/challenge. Required to approve.
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Decision executed atomically via CAS transition
        '403':
          description: Step-up failed (STEP_UP_NOT_ENROLLED, STEP_UP_COOLDOWN with `error.details.remainingSeconds`, STEP_UP_REQUIRED, STEP_UP_CHALLENGE_*, STEP_UP_FAILED, STEP_UP_LOCKED) or blocked at execution time by current caps
        '409':
          description: Concurrent action in progress or already decided
        '422':
          description: Blocked by Guardian policy or invalid challenge

  /api/approvals/{id}/retry:
    post:
      summary: Retry Failed Approval Execution
      description: Requires a fresh step-up (proof + challengeNonce), re-checks current caps atomically, max 3 retries, within 24h of the decision, and is refused if the action already performed its side effect.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeNonce:
                  type: string
                proof:
                  $ref: '#/components/schemas/StepUpProof'
      responses:
        '200':
          description: Approval execution re-attempted
        '403':
          description: Step-up failed or blocked by current caps
        '409':
          description: Already executed, retry limit reached, or concurrent
        '404':
          description: Approval not found

